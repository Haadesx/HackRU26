[project]
name = "medcheck"
version = "0.1.0"
description = "MedCheck AI inference subsystem — OCR-first medication label reading"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = ["."]
